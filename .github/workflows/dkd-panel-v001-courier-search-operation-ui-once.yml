name: DKD Panel Courier Search Operation UI Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested panel UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          courier_path = Path('src/screens/CouriersScreenPremium.js')
          courier = courier_path.read_text()

          marker = "  const [dkd_error, dkd_set_error] = useState('');\n  const dkd_intro_value"
          replacement = "  const [dkd_error, dkd_set_error] = useState('');\n  const [dkd_courier_search, dkd_set_courier_search] = useState('');\n  const [dkd_visible_count, dkd_set_visible_count] = useState(5);\n  const dkd_intro_value"
          if marker not in courier:
              raise SystemExit('courier state marker missing')
          courier = courier.replace(marker, replacement, 1)

          marker = "  const dkd_online = useMemo(() => dkd_couriers.filter((dkd_item) => dkd_item.dkd_is_online).length, [dkd_couriers]);\n  const dkd_intro_translate_value"
          replacement = """  const dkd_online = useMemo(() => dkd_couriers.filter((dkd_item) => dkd_item.dkd_is_online).length, [dkd_couriers]);
  const dkd_filtered_couriers = useMemo(() => {
    const dkd_query_value = dkd_courier_search.trim().toLocaleLowerCase('tr-TR');
    if (!dkd_query_value) return dkd_couriers;
    const dkd_compact_query_value = dkd_query_value.replace(/[^a-z0-9çğıöşü]/gi, '');
    return dkd_couriers.filter((dkd_item) => {
      const dkd_name_value = String(dkd_item.dkd_display_name || '').toLocaleLowerCase('tr-TR');
      const dkd_plate_value = String(dkd_item.dkd_plate_no || '').toLocaleLowerCase('tr-TR');
      const dkd_compact_plate_value = dkd_plate_value.replace(/[^a-z0-9çğıöşü]/gi, '');
      return dkd_name_value.includes(dkd_query_value)
        || dkd_plate_value.includes(dkd_query_value)
        || (!!dkd_compact_query_value && dkd_compact_plate_value.includes(dkd_compact_query_value));
    });
  }, [dkd_courier_search, dkd_couriers]);
  const dkd_visible_couriers = useMemo(() => dkd_filtered_couriers.slice(0, dkd_visible_count), [dkd_filtered_couriers, dkd_visible_count]);
  useEffect(() => { dkd_set_visible_count(5); }, [dkd_courier_search]);
  const dkd_intro_translate_value"""
          if marker not in courier:
              raise SystemExit('courier derived marker missing')
          courier = courier.replace(marker, replacement, 1)

          old = '<View style={styles.heroCopy}><Text style={styles.pageKicker}>EKİP YÖNETİMİ</Text><Text style={styles.pageTitle}>Kuryeler</Text></View>'
          new = '<View style={styles.heroCopy}><Text style={styles.pageKicker}>EKİP YÖNETİMİ</Text><Text style={styles.pageTitle} numberOfLines={1} adjustsFontSizeToFit minimumFontScale={0.86}>Kuryeler</Text></View>'
          if old not in courier:
              raise SystemExit('courier title marker missing')
          courier = courier.replace(old, new, 1)

          marker = "          </LinearGradient>\n\n          {!!dkd_error"
          search_block = """          </LinearGradient>

          <LinearGradient colors={['rgba(22,43,72,.96)', 'rgba(20,29,55,.96)']} style={styles.teamSearchCard}>
            <View style={styles.teamSearchIcon}><MaterialCommunityIcons name=\"account-search-outline\" size={23} color=\"#70EAFF\" /></View>
            <TextInput
              value={dkd_courier_search}
              onChangeText={dkd_set_courier_search}
              placeholder=\"Kurye adı veya plaka ara\"
              placeholderTextColor=\"#7186A4\"
              autoCapitalize=\"characters\"
              autoCorrect={false}
              style={styles.teamSearchInput}
            />
            {!!dkd_courier_search && <Pressable onPress={() => dkd_set_courier_search('')} style={styles.teamSearchClear}><MaterialCommunityIcons name=\"close\" size={19} color=\"#B8CBE2\" /></Pressable>}
          </LinearGradient>
          <View style={styles.listMetaRow}>
            <Text style={styles.listMetaText}>{dkd_filtered_couriers.length} kurye bulundu</Text>
            <Text style={styles.listMetaText}>Gösterilen {Math.min(dkd_visible_count, dkd_filtered_couriers.length)}/{dkd_filtered_couriers.length}</Text>
          </View>

          {!!dkd_error"""
          if marker not in courier:
              raise SystemExit('courier search insertion marker missing')
          courier = courier.replace(marker, search_block, 1)

          courier = courier.replace("{dkd_couriers.length === 0 ? <DkdEmptyState", "{dkd_filtered_couriers.length === 0 ? <DkdEmptyState", 1)
          courier = courier.replace("text=\"Kurye Ekle ile DraBornGo kullanıcılarını ad, plaka, e-posta veya tam TC eşleşmesiyle bulabilirsin.\" /> : dkd_couriers.map((dkd_courier) => (", "text={dkd_courier_search ? 'Bu isim veya plakayla eşleşen bağlı kurye bulunamadı.' : 'Kurye Ekle ile DraBornGo kullanıcılarını ad, plaka, e-posta veya tam TC eşleşmesiyle bulabilirsin.'} /> : dkd_visible_couriers.map((dkd_courier) => (", 1)

          marker = "          ))}\n        </Animated.View>"
          more_block = """          ))}
          {dkd_filtered_couriers.length > dkd_visible_count && (
            <Pressable onPress={() => { Haptics.selectionAsync().catch(() => null); dkd_set_visible_count((dkd_value) => dkd_value + 5); }} style={({ pressed }) => [styles.moreButtonWrap, pressed && styles.buttonPressed]}>
              <LinearGradient colors={['rgba(93,232,255,.18)', 'rgba(119,134,255,.16)', 'rgba(168,107,255,.14)']} style={styles.moreButton}>
                <MaterialCommunityIcons name=\"chevron-double-down\" size={22} color=\"#87EDFF\" />
                <View style={styles.flexOne}><Text style={styles.moreButtonTitle}>Daha Fazla</Text><Text style={styles.moreButtonSub}>5 kurye daha göster</Text></View>
                <Text style={styles.moreRemaining}>{dkd_filtered_couriers.length - dkd_visible_count} kaldı</Text>
              </LinearGradient>
            </Pressable>
          )}
        </Animated.View>"""
          if marker not in courier:
              raise SystemExit('courier more marker missing')
          courier = courier.replace(marker, more_block, 1)

          courier = courier.replace("  heroCopy: { flex: 1 },", "  heroCopy: { flex: 1, minWidth: 0 },", 1)
          courier = courier.replace("  pageTitle: { color: '#FFFFFF', fontSize: 34, lineHeight: 39, fontWeight: '900', marginTop: 2, letterSpacing: -.8 },", "  pageTitle: { color: '#FFFFFF', fontSize: 29, lineHeight: 34, fontWeight: '900', marginTop: 2, letterSpacing: -.65 },", 1)

          style_marker = "  errorCard: { minHeight: 50,"
          new_styles = """  teamSearchCard: { minHeight: 60, borderRadius: 20, paddingHorizontal: 13, flexDirection: 'row', alignItems: 'center', gap: 10, marginBottom: 8, borderWidth: 1, borderColor: 'rgba(109,232,255,.15)' },
  teamSearchIcon: { width: 40, height: 40, borderRadius: 14, alignItems: 'center', justifyContent: 'center', backgroundColor: 'rgba(105,234,255,.09)' },
  teamSearchInput: { flex: 1, color: '#FFFFFF', fontSize: 15.5, fontWeight: '800', paddingVertical: 0 },
  teamSearchClear: { width: 36, height: 36, borderRadius: 12, alignItems: 'center', justifyContent: 'center', backgroundColor: 'rgba(255,255,255,.05)' },
  listMetaRow: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingHorizontal: 4, marginBottom: 11 },
  listMetaText: { color: '#8195B0', fontSize: 12.5, fontWeight: '800' },
  moreButtonWrap: { borderRadius: 20, overflow: 'hidden', marginTop: 2, marginBottom: 12 },
  moreButton: { minHeight: 64, borderRadius: 20, borderWidth: 1, borderColor: 'rgba(118,229,255,.16)', flexDirection: 'row', alignItems: 'center', gap: 10, paddingHorizontal: 15 },
  moreButtonTitle: { color: '#E8FAFF', fontSize: 15, fontWeight: '900' },
  moreButtonSub: { color: '#8EA6C4', fontSize: 12.5, fontWeight: '700', marginTop: 2 },
  moreRemaining: { color: '#99EFFF', fontSize: 12.5, fontWeight: '900' },
  errorCard: { minHeight: 50,"""
          if style_marker not in courier:
              raise SystemExit('courier style marker missing')
          courier = courier.replace(style_marker, new_styles, 1)
          courier_path.write_text(courier)

          dashboard_path = Path('src/screens/DashboardScreen.js')
          dashboard = dashboard_path.read_text()
          dashboard = dashboard.replace("import { MaterialCommunityIcons } from '@expo/vector-icons';", "import { MaterialCommunityIcons } from '@expo/vector-icons';\nimport { LinearGradient } from 'expo-linear-gradient';", 1)

          old_operation = '''      <DkdSectionTitle icon="bike" title="Kurye Operasyonu" subtitle={`${dkd_data?.dkd_couriers_online || 0} çevrimiçi • ${dkd_data?.dkd_couriers_total || 0} bağlı kurye`} />
      <View style={styles.summaryRow}>
        <View style={styles.summaryCard}><MaterialCommunityIcons name="access-point" size={21} color={dkd_theme.green} /><Text style={styles.summaryNumber}>{dkd_data?.dkd_couriers_online || 0}</Text><Text style={styles.summaryLabel}>Çevrimiçi</Text></View>
        <View style={styles.summaryCard}><MaterialCommunityIcons name="account-group-outline" size={21} color={dkd_theme.cyan} /><Text style={styles.summaryNumber}>{dkd_data?.dkd_couriers_total || 0}</Text><Text style={styles.summaryLabel}>Toplam Kurye</Text></View>
        <View style={styles.summaryCard}><MaterialCommunityIcons name="package-variant" size={21} color={dkd_theme.yellow} /><Text style={styles.summaryNumber}>{dkd_data?.dkd_active_orders || 0}</Text><Text style={styles.summaryLabel}>Aktif Paket</Text></View>
      </View>'''
          new_operation = '''      <LinearGradient colors={['#0B2637', '#10254B', '#281A4D']} start={{ x: 0, y: 0 }} end={{ x: 1, y: 1 }} style={styles.operationPanel}>
        <View style={styles.operationGlowOne} /><View style={styles.operationGlowTwo} />
        <View style={styles.operationHead}>
          <LinearGradient colors={['#66E8FF', '#67F0B2']} style={styles.operationIcon}><MaterialCommunityIcons name="bike-fast" size={25} color="#07131D" /></LinearGradient>
          <View style={styles.operationCopy}><Text style={styles.operationTitle}>Kurye Operasyonu</Text><Text style={styles.operationSub}>{dkd_data?.dkd_couriers_online || 0} çevrimiçi • {dkd_data?.dkd_couriers_total || 0} bağlı kurye</Text></View>
          <View style={styles.operationLive}><View style={styles.operationLiveDot} /><Text style={styles.operationLiveText}>CANLI</Text></View>
        </View>
        <View style={styles.summaryRow}>
          <LinearGradient colors={['rgba(62,229,169,.20)', 'rgba(40,125,121,.12)']} style={styles.operationMetric}><View style={styles.operationMetricIcon}><MaterialCommunityIcons name="access-point" size={22} color="#62F0B6" /></View><Text style={styles.summaryNumber}>{dkd_data?.dkd_couriers_online || 0}</Text><Text style={styles.summaryLabel}>Çevrimiçi</Text></LinearGradient>
          <LinearGradient colors={['rgba(75,209,255,.20)', 'rgba(69,101,210,.12)']} style={styles.operationMetric}><View style={styles.operationMetricIcon}><MaterialCommunityIcons name="account-group" size={22} color="#75E8FF" /></View><Text style={styles.summaryNumber}>{dkd_data?.dkd_couriers_total || 0}</Text><Text style={styles.summaryLabel}>Toplam Kurye</Text></LinearGradient>
          <LinearGradient colors={['rgba(255,199,86,.21)', 'rgba(217,111,69,.12)']} style={styles.operationMetric}><View style={styles.operationMetricIcon}><MaterialCommunityIcons name="package-variant-closed" size={22} color="#FFD36F" /></View><Text style={styles.summaryNumber}>{dkd_data?.dkd_active_orders || 0}</Text><Text style={styles.summaryLabel}>Aktif Paket</Text></LinearGradient>
        </View>
      </LinearGradient>'''
          if old_operation not in dashboard:
              raise SystemExit('dashboard operation marker missing')
          dashboard = dashboard.replace(old_operation, new_operation, 1)
          style_marker = "  summaryRow: { flexDirection: 'row', gap: 8 }, summaryCard:"
          style_replacement = """  operationPanel: { borderRadius: 27, padding: 14, marginTop: 20, marginBottom: 12, overflow: 'hidden', borderWidth: 1, borderColor: 'rgba(111,227,255,.16)' },
  operationGlowOne: { position: 'absolute', width: 160, height: 160, borderRadius: 999, right: -75, top: -90, backgroundColor: 'rgba(106,232,255,.10)' },
  operationGlowTwo: { position: 'absolute', width: 150, height: 150, borderRadius: 999, left: -90, bottom: -105, backgroundColor: 'rgba(170,108,255,.10)' },
  operationHead: { flexDirection: 'row', alignItems: 'center', gap: 11, marginBottom: 13 },
  operationIcon: { width: 48, height: 48, borderRadius: 17, alignItems: 'center', justifyContent: 'center' },
  operationCopy: { flex: 1, minWidth: 0 },
  operationTitle: { color: '#FFFFFF', fontSize: 19, fontWeight: '900' },
  operationSub: { color: '#AABDD5', fontSize: 13.5, fontWeight: '700', marginTop: 3 },
  operationLive: { minHeight: 30, paddingHorizontal: 9, borderRadius: 999, flexDirection: 'row', alignItems: 'center', gap: 6, backgroundColor: 'rgba(82,234,173,.11)', borderWidth: 1, borderColor: 'rgba(82,234,173,.17)' },
  operationLiveDot: { width: 7, height: 7, borderRadius: 99, backgroundColor: '#62F0B6' },
  operationLiveText: { color: '#8BF4C8', fontSize: 11.5, fontWeight: '900', letterSpacing: .65 },
  summaryRow: { flexDirection: 'row', gap: 8 },
  operationMetric: { flex: 1, minHeight: 112, borderRadius: 20, padding: 11, borderWidth: 1, borderColor: 'rgba(255,255,255,.08)', overflow: 'hidden' },
  operationMetricIcon: { width: 35, height: 35, borderRadius: 12, alignItems: 'center', justifyContent: 'center', backgroundColor: 'rgba(255,255,255,.08)' },
  summaryCard:"""
          if style_marker not in dashboard:
              raise SystemExit('dashboard style marker missing')
          dashboard = dashboard.replace(style_marker, style_replacement, 1)
          dashboard_path.write_text(dashboard)

          components_path = Path('src/components/PanelComponents.js')
          components = components_path.read_text()
          if 'Canlı Supabase' not in components:
              raise SystemExit('live supabase text missing')
          components = components.replace('Canlı Supabase', 'Canlı Takip', 1)
          components_path.write_text(components)
          PY

          npm ci
          npx expo-doctor@latest
          npx expo export --platform android --output-dir /tmp/dkd-panel-v001-export

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/CouriersScreenPremium.js src/screens/DashboardScreen.js src/components/PanelComponents.js
          git rm .github/workflows/dkd-panel-v001-courier-search-operation-ui-once.yml
          git commit -m "feat: add courier search paging and modern operation UI"
          git push
