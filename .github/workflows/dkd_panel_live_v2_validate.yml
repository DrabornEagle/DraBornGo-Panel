name: DraBornGo Panel live v2 validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_panel_live_v2_validate.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate Android Metro export only
        run: npx expo export --platform android --output-dir dist-panel-live-v2
