name: DraBornGo Panel v0.0.3 finalize
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dkd-panel-v003-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply release patches
        run: |
          node <<'NODE'
          const fs=require('fs');
          for (const p of ['src/screens/AdminCenterScreen.js','src/screens/PlatformFeeScreen.js']) {
            let s=fs.readFileSync(p,'utf8');
            s=s.replace("from '../services/panelService';","from '../services/adminService';");
            fs.writeFileSync(p,s);
          }
          const settings='src/screens/SettingsScreen.js';
          let s=fs.readFileSync(settings,'utf8');
          s=s.replace('DraBornGo Ortak Supabase','DraBornGo Ortak Veritabanı');
          s=s.replace('DraBornGo Panel v0.0.1 • Expo SDK 57','DraBornGo Panel v0.0.3');
          fs.writeFileSync(settings,s);
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          app.expo.version='0.0.3'; app.expo.android=app.expo.android||{}; app.expo.android.versionCode=1;
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='0.0.3'; pkg.dependencies=pkg.dependencies||{}; pkg.dependencies['expo-document-picker']='~57.0.1';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Validate Expo Android JS bundle
        run: npx expo export --platform android --output-dir /tmp/dkd-panel-v003-export
      - name: Commit finalized release and remove helper workflow
        run: |
          rm -f .github/workflows/dkd-panel-v003-finalize.yml
          git config user.name 'DraBornGo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'release: DraBornGo Panel v0.0.3 code1' || exit 0
          git push origin HEAD:main
