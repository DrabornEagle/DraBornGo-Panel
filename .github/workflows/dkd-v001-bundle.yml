name: DKD v0.0.1 Bundle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dkd-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Android Metro export
        shell: bash
        run: |
          set +e
          npx expo export --platform android --output-dir /tmp/dkd-export > dkd-v001-bundle-report.txt 2>&1
          dkd_status=$?
          echo "" >> dkd-v001-bundle-report.txt
          echo "DKD_BUNDLE_EXIT_CODE=$dkd_status" >> dkd-v001-bundle-report.txt
          cat dkd-v001-bundle-report.txt
          exit $dkd_status

      - name: Save report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dkd-v001-bundle-report.txt
          git commit -m "chore: validate Android Metro bundle" || exit 0
          git push
