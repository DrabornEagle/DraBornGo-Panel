name: DKD Panel Lock Validate Once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-lock-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh lock file
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Android Metro export
        run: npx expo export --platform android --output-dir /tmp/dkd-panel-export --clear
      - name: Commit refreshed lock to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lock file already current."
            exit 0
          fi
          git commit -m "chore: sync react-native-svg lockfile"
          git push origin HEAD:${{ github.head_ref }}
