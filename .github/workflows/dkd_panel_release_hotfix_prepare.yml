name: DraBornGo Panel v0.0.2 release hotfix prepare
on:
  push:
    branches: [work/v0.0.2-release-hotfix-2026-08-11]
    paths:
      - '.github/workflows/dkd_panel_release_hotfix_prepare.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.0.2-release-hotfix-2026-08-11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install notification runtime and sync app config
        shell: bash
        run: |
          npx expo install expo-notifications expo-device expo-constants
          node <<'DKD_NODE'
          const fs=require('fs');
          const path='app.json';
          const j=JSON.parse(fs.readFileSync(path,'utf8'));
          j.expo.plugins=Array.isArray(j.expo.plugins)?j.expo.plugins:[];
          if(!j.expo.plugins.some((p)=>Array.isArray(p)?p[0]==='expo-notifications':p==='expo-notifications')){
            j.expo.plugins.push(['expo-notifications',{defaultChannel:'draborngo-panel',color:'#69E9FF'}]);
          }
          fs.writeFileSync(path,JSON.stringify(j,null,2)+'\n');
          DKD_NODE
      - name: Add resilient automatic order refresh fallback
        shell: bash
        run: |
          node <<'DKD_NODE'
          const fs=require('fs'); const path='App.js'; let s=fs.readFileSync(path,'utf8');
          const anchor="  useEffect(() => {\n    return dkd_panel_subscribe_live((dkd_payload_value) => {";
          if(!s.includes('dkd-panel-auto-refresh-fallback')){
            const block="  useEffect(() => {\n    const dkd_interval_value = setInterval(() => dkd_set_refresh_signal((dkd_value) => dkd_value + 1), 4000); // dkd-panel-auto-refresh-fallback\n    return () => clearInterval(dkd_interval_value);\n  }, []);\n\n";
            const index=s.indexOf(anchor); if(index<0) throw new Error('Realtime subscription anchor not found');
            s=s.slice(0,index)+block+s.slice(index); fs.writeFileSync(path,s);
          }
          DKD_NODE
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Validate Android Metro bundle
        run: npx expo export --platform android --output-dir dist-ci
      - name: Record validation and push prepared files
        shell: bash
        run: |
          printf 'DraBornGo Panel v0.0.2 release hotfix: dependency sync + realtime fallback + Android Metro export passed.\n' > .github/dkd-v0.0.2-release-hotfix-validation.txt
          git add package.json package-lock.json app.json App.js .github/dkd-v0.0.2-release-hotfix-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: prepare panel v0.0.2 release hotfix'
            git push origin HEAD:work/v0.0.2-release-hotfix-2026-08-11
          fi
