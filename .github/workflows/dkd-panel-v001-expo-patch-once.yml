name: DKD Panel Expo Patch Validate Once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-expo-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh Expo SDK 57 patch and lock
        run: |
          npm install expo@~57.0.12 --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Android Metro export
        run: npx expo export --platform android --output-dir /tmp/dkd-panel-export --clear
      - name: Commit validated lock and package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: align Expo SDK 57 patch version"
          git push origin HEAD:${{ github.head_ref }}
