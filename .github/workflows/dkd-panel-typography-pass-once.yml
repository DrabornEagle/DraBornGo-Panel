name: DKD Panel Typography Pass Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-panel-typography:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase panel text readability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('src').rglob('*'):
              if not path.is_file() or path.suffix not in {'.js','.jsx','.ts','.tsx'}:
                  continue
              text = path.read_text()
              def font(m):
                  value = float(m.group(1))
                  if value < 11:
                      new = 13.0
                  elif value < 12.5:
                      new = value + 2.0
                  elif value < 14:
                      new = value + 1.5
                  else:
                      return m.group(0)
                  out = f'{new:.1f}'.rstrip('0').rstrip('.')
                  return 'fontSize: ' + out
              def line(m):
                  value = float(m.group(1))
                  if value < 16:
                      new = max(17.0, value + 2.0)
                      out = f'{new:.1f}'.rstrip('0').rstrip('.')
                      return 'lineHeight: ' + out
                  return m.group(0)
              updated = re.sub(r'fontSize:\s*(\d+(?:\.\d+)?)', font, text)
              updated = re.sub(r'lineHeight:\s*(\d+(?:\.\d+)?)', line, updated)
              if updated != text:
                  path.write_text(updated)
          PY
      - name: Commit typography and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git rm .github/workflows/dkd-panel-typography-pass-once.yml
          git commit -m "feat: enlarge app-wide DraBornGo Panel typography"
          git push
