name: DraBornGo Panel v0.0.2 validation
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'App.js'
      - 'src/**'
      - '.github/workflows/dkd-v0-0-2-ci.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync lock identity
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Android Metro export
        run: npx expo export --platform android --output-dir dist-ci
      - name: Record successful validation
        run: |
          printf 'DraBornGo Panel v0.0.2 validated: npm ci + Expo Doctor + Android Metro export. No APK/AAB build.\n' > .github/dkd-v0.0.2-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/dkd-v0.0.2-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync panel v0.0.2 lock and validation record'
            git push
          fi
