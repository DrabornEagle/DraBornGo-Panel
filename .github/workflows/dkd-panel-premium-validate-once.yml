name: DKD Panel Premium Validate Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dkd-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Clean install
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor@latest --verbose
      - name: Android Metro export
        run: npx expo export --platform android --output-dir /tmp/dkd-panel-premium
      - name: Record success and self-clean
        shell: bash
        run: |
          printf '%s\n' 'npm ci: PASS' 'Expo Doctor: PASS' 'Android Metro export: PASS' > dkd-panel-v001-premium-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dkd-panel-v001-premium-validation.txt
          git rm .github/workflows/dkd-panel-premium-validate-once.yml
          git commit -m "chore: validate premium DraBornGo Panel courier screen"
          git push
