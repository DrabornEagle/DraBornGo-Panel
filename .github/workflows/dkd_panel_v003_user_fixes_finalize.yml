name: DraBornGo Panel v0.0.3 requested fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dkd_panel_v003_user_fixes_finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply requested fixes
        run: node .github/scripts/dkd_panel_v003_user_fixes.js

      - name: Install exact dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Android Metro export
        run: npx expo export --platform android --output-dir /tmp/dkd-panel-v003-user-fixes

      - name: Commit validated fixes
        run: |
          rm -f .github/workflows/dkd_panel_v003_user_fixes_finalize.yml
          rm -f .github/scripts/dkd_panel_v003_user_fixes.js
          git config user.name 'DraBornGo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(panel): finish v0.0.3 navigation tracking payment and fee fixes' || exit 0
          git push origin HEAD:main
