name: DraBornGo Panel Development APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_panel_build_development_apk.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/dkd_development_build_trigger/**'

concurrency:
  group: draborngo-panel-development-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development_apk:
    name: DraBornGo Panel v0.0.2 Development Client APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install development dependencies
        run: npm install --no-package-lock
      - name: Verify Development Client dependencies
        shell: bash
        run: |
          node <<'DKD_NODE'
          const p=require('./package.json'); const a=require('./app.json').expo;
          if(!p.dependencies['expo-dev-client']) throw new Error('expo-dev-client missing');
          if(!p.dependencies['@rnmapbox/maps']) throw new Error('@rnmapbox/maps missing');
          if(a.version!=='0.0.2'||Number(a.android.versionCode)!==2) throw new Error('Panel identity mismatch');
          if(!Array.isArray(a.plugins)||!a.plugins.some((x)=>Array.isArray(x)&&x[0]==='@rnmapbox/maps')) throw new Error('Panel Mapbox plugin missing');
          console.log('DraBornGo Panel development identity OK');
          DKD_NODE
      - name: Prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate native Development Client project
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Tune Gradle
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.parallel=false\n' >> android/gradle.properties
      - name: Build Development APK
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Collect Development APK
        shell: bash
        run: |
          mkdir -p dkd_development_apk_output
          dkd_apk_path="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$dkd_apk_path"
          cp "$dkd_apk_path" dkd_development_apk_output/DraBornGo-Panel-v0.0.2-development.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose dkd_development_apk_output/DraBornGo-Panel-v0.0.2-development.apk
          sha256sum dkd_development_apk_output/DraBornGo-Panel-v0.0.2-development.apk | tee dkd_development_apk_output/SHA256.txt
          printf 'Development Client / debug APK. Connect with expo start --dev-client.\n' > dkd_development_apk_output/README.txt
      - name: Upload Development APK
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGo_Panel_Development_APK_v0_0_2
          path: dkd_development_apk_output/
          retention-days: 14
