name: DKD v0.0.1 Verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dkd-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Expo Doctor
        shell: bash
        run: |
          set +e
          npx expo-doctor@latest --verbose > dkd-v001-verify-report.txt 2>&1
          dkd_status=$?
          echo "" >> dkd-v001-verify-report.txt
          echo "DKD_EXPO_DOCTOR_EXIT_CODE=$dkd_status" >> dkd-v001-verify-report.txt
          cat dkd-v001-verify-report.txt
          exit $dkd_status

      - name: Commit lockfile and report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json dkd-v001-verify-report.txt
          git commit -m "chore: validate v0.0.1 auth ui fix" || exit 0
          git push
