name: DraBornGo Panel v0.0.3 icon + release APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_panel_v003_icon_release_once.yml'

permissions:
  contents: write

concurrency:
  group: draborngo-panel-v003-icon-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick

      - name: Restore exact Panel artwork at full dimensions
        shell: bash
        run: |
          mkdir -p assets/images
          dkd_url='https://media.canva.com/v2/image-resize/format:JPG/height:1024/quality:100/uri:ifs%3A%2F%2FM%2F0c9dad2e-7e99-4f3c-845b-51e28194eb45/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAJ2R5lqHSrk3vPehajdjTGkTIZ1j00cLTnMkS9MsMLJ3&exp=1786537289&osig=AAAAAAAAAAAAAAAAAAAAAIzUpoq1m7wZ_mRZOwEyKSNBZhJN5E7_ZsjioETm65xD&signer=media-rpc'
          curl --fail --location --retry 3 "$dkd_url" -o assets/images/dkd-panel-icon-source.jpg
          dkd_size="$(identify -format '%wx%h' assets/images/dkd-panel-icon-source.jpg)"
          echo "Panel source dimensions: $dkd_size"
          test "$dkd_size" = '1536x1024'
          convert assets/images/dkd-panel-icon-source.jpg -background black -gravity center -extent 1536x1536 -quality 100 assets/images/dkd-panel-icon-square.jpg
          test "$(identify -format '%wx%h' assets/images/dkd-panel-icon-square.jpg)" = '1536x1536'

      - name: Configure exact icon and explicit splash
        shell: bash
        run: |
          npm ci
          npx expo install expo-splash-screen
          node <<'NODE'
          const fs=require('fs');
          const path='app.json';
          const app=JSON.parse(fs.readFileSync(path,'utf8'));
          const expo=app.expo;
          expo.icon='./assets/images/dkd-panel-icon-square.jpg';
          expo.backgroundColor='#000000';
          expo.android=expo.android||{};
          expo.android.adaptiveIcon={
            foregroundImage:'./assets/images/dkd-panel-icon-square.jpg',
            backgroundColor:'#000000'
          };
          const plugins=Array.isArray(expo.plugins)?expo.plugins:[];
          const filtered=plugins.filter((p)=>!(p==='expo-splash-screen'||(Array.isArray(p)&&p[0]==='expo-splash-screen')));
          filtered.unshift(['expo-splash-screen',{
            image:'./assets/images/dkd-panel-icon-source.jpg',
            imageWidth:320,
            resizeMode:'contain',
            backgroundColor:'#000000',
            dark:{backgroundColor:'#000000'}
          }]);
          expo.plugins=filtered;
          fs.writeFileSync(path,JSON.stringify(app,null,2)+'\n');
          NODE
          node <<'NODE'
          const a=require('./app.json').expo;
          const p=require('./package.json');
          if(a.version!=='0.0.3'||p.version!=='0.0.3') throw new Error('Panel must remain v0.0.3');
          if(Number(a.android.versionCode)!==1) throw new Error('Panel versionCode must remain 1');
          if(a.icon!=='./assets/images/dkd-panel-icon-square.jpg') throw new Error('Panel icon not configured');
          const splash=(a.plugins||[]).find(x=>Array.isArray(x)&&x[0]==='expo-splash-screen');
          if(!splash) throw new Error('Explicit splash missing');
          console.log('Panel identity/icon/splash OK');
          NODE

      - name: Validate Expo project
        run: |
          npx expo-doctor@latest
          npx expo export --platform android --output-dir /tmp/dkd-panel-release-export

      - name: Prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Prepare release signing
        shell: bash
        run: |
          mkdir -p android/app/dkd_secure
          if [ -n "$DKD_ANDROID_KEYSTORE_BASE64" ] && [ -n "$DKD_ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$DKD_ANDROID_KEY_ALIAS" ] && [ -n "$DKD_ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$DKD_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dkd_secure/dkd_release_keystore.jks
            echo 'DKD_SIGNING_MODE=repository-secret' >> "$GITHUB_ENV"
          else
            export DKD_ANDROID_KEYSTORE_PASSWORD='DkdPanelRelease2026!'
            export DKD_ANDROID_KEY_ALIAS='dkd-panel-release'
            export DKD_ANDROID_KEY_PASSWORD='DkdPanelRelease2026!'
            keytool -genkeypair -v -keystore android/app/dkd_secure/dkd_release_keystore.jks -storepass "$DKD_ANDROID_KEYSTORE_PASSWORD" -alias "$DKD_ANDROID_KEY_ALIAS" -keypass "$DKD_ANDROID_KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=DraBornGo Panel Release,O=DrabornEagle,C=TR'
            echo "DKD_ANDROID_KEYSTORE_PASSWORD=$DKD_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DKD_ANDROID_KEY_ALIAS=$DKD_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "DKD_ANDROID_KEY_PASSWORD=$DKD_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'DKD_SIGNING_MODE=ephemeral-release' >> "$GITHUB_ENV"
          fi
          keytool -list -keystore android/app/dkd_secure/dkd_release_keystore.jks -storepass "$DKD_ANDROID_KEYSTORE_PASSWORD" -alias "$DKD_ANDROID_KEY_ALIAS" >/dev/null
          cat > android/app/dkd_release_signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file('dkd_secure/dkd_release_keystore.jks')
                      storePassword System.getenv('DKD_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('DKD_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('DKD_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.dkdRelease } }
          }
          GRADLE
          printf '\napply from: "dkd_release_signing.gradle"\n' >> android/app/build.gradle
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.parallel=false\n' >> android/gradle.properties

      - name: Build normal release APK
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify and collect Panel APK
        shell: bash
        run: |
          mkdir -p dkd_release_apk_output
          dkd_apk_path="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$dkd_apk_path"
          cp "$dkd_apk_path" dkd_release_apk_output/DraBornGo-Panel-v0.0.3-code1-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose dkd_release_apk_output/DraBornGo-Panel-v0.0.3-code1-release.apk
          sha256sum dkd_release_apk_output/DraBornGo-Panel-v0.0.3-code1-release.apk | tee dkd_release_apk_output/SHA256.txt
          printf 'Signing mode: %s\n' "$DKD_SIGNING_MODE" | tee dkd_release_apk_output/SIGNING_MODE.txt
          ls -lh dkd_release_apk_output

      - uses: actions/upload-artifact@v4
        with:
          name: DraBornGo_Panel_Release_APK_v0_0_3_code1
          path: dkd_release_apk_output/
          retention-days: 14

      - name: Commit icon/splash config and update persistent release workflow
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='.github/workflows/dkd_panel_release_apk.yml';
          let s=fs.readFileSync(p,'utf8');
          s=s.replaceAll('v0.0.2 code 2','v0.0.3 code 1');
          s=s.replaceAll("a.version!=='0.0.2'||p.version!=='0.0.2'","a.version!=='0.0.3'||p.version!=='0.0.3'");
          s=s.replaceAll("Panel version must be 0.0.2","Panel version must be 0.0.3");
          s=s.replaceAll('Number(a.android.versionCode)!==2','Number(a.android.versionCode)!==1');
          s=s.replaceAll('Panel versionCode must be 2','Panel versionCode must be 1');
          s=s.replaceAll('DraBornGo-Panel-v0.0.2-code2-release.apk','DraBornGo-Panel-v0.0.3-code1-release.apk');
          s=s.replaceAll('DraBornGo_Panel_Release_APK_v0_0_2_code2','DraBornGo_Panel_Release_APK_v0_0_3_code1');
          fs.writeFileSync(p,s);
          NODE
          rm -f .github/workflows/dkd_panel_v003_icon_release_once.yml
          git config user.name 'DraBornGo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.json package.json package-lock.json assets/images .github/workflows/dkd_panel_release_apk.yml .github/workflows/dkd_panel_v003_icon_release_once.yml
          git commit -m 'release(panel): apply supplied icon and splash for v0.0.3 code1' || true
          git push origin HEAD:main
