name: DKD Expo Doctor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dkd-doctor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Expo Doctor
        shell: bash
        run: |
          set +e
          npx expo-doctor@latest --verbose > expo-doctor-report.txt 2>&1
          dkd_status=$?
          echo "" >> expo-doctor-report.txt
          echo "DKD_EXPO_DOCTOR_EXIT_CODE=$dkd_status" >> expo-doctor-report.txt
          cat expo-doctor-report.txt
          exit 0

      - name: Save report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expo-doctor-report.txt
          git commit -m "chore: save Expo Doctor report" || exit 0
          git push
