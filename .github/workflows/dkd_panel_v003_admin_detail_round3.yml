name: DraBornGo Panel v0.0.3 admin detail round3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dkd_panel_v003_admin_detail_round3.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply requested fixes
        run: node .github/scripts/dkd_panel_v003_admin_detail_round3.js
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Android Metro export
        run: npx expo export --platform android --output-dir /tmp/dkd-panel-v003-admin-round3
      - name: Commit validated fixes
        run: |
          rm -f .github/workflows/dkd_panel_v003_admin_detail_round3.yml
          rm -f .github/scripts/dkd_panel_v003_admin_detail_round3.js
          git config user.name 'DraBornGo Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(panel): upgrade settings and admin list navigation' || exit 0
          git push origin HEAD:main
