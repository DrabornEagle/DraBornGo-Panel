name: Prepare Panel release hotfix branch once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dkd_prepare_release_hotfix_once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.0.2-release-hotfix-2026-08-11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Add Expo notification dependencies and plugin
        shell: bash
        run: |
          npx expo install expo-notifications expo-device expo-constants
          node <<'DKD_NODE'
          const fs=require('fs'); const p='app.json'; const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.expo.plugins=Array.isArray(j.expo.plugins)?j.expo.plugins:[];
          if(!j.expo.plugins.some((x)=>Array.isArray(x)?x[0]==='expo-notifications':x==='expo-notifications')) j.expo.plugins.push(['expo-notifications',{defaultChannel:'draborngo-panel',color:'#69E9FF'}]);
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          DKD_NODE
      - name: Add automatic refresh fallback
        shell: bash
        run: |
          node <<'DKD_NODE'
          const fs=require('fs'); const p='App.js'; let s=fs.readFileSync(p,'utf8');
          if(!s.includes('dkd-panel-auto-refresh-fallback')){
            const marker="  useEffect(() => {\n    return dkd_panel_subscribe_live((dkd_payload_value) => {";
            const i=s.indexOf(marker); if(i<0) throw new Error('subscription marker missing');
            const block="  useEffect(() => {\n    const dkd_interval_value = setInterval(() => dkd_set_refresh_signal((dkd_value) => dkd_value + 1), 4000); // dkd-panel-auto-refresh-fallback\n    return () => clearInterval(dkd_interval_value);\n  }, []);\n\n";
            s=s.slice(0,i)+block+s.slice(i); fs.writeFileSync(p,s);
          }
          DKD_NODE
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npx expo export --platform android --output-dir dist-ci
      - name: Commit prepared branch
        shell: bash
        run: |
          printf 'DraBornGo Panel v0.0.2 release hotfix validated: dependency sync, realtime fallback and Android Metro export passed.\n' > .github/dkd-v0.0.2-release-hotfix-validation.txt
          git add package.json package-lock.json app.json App.js .github/dkd-v0.0.2-release-hotfix-validation.txt
          if ! git diff --cached --quiet; then git commit -m 'chore: prepare Panel v0.0.2 release hotfix'; git push origin HEAD:work/v0.0.2-release-hotfix-2026-08-11; fi
