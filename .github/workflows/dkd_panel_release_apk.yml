name: DraBornGo Panel Release APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/dkd_panel_release_build_trigger/**'

concurrency:
  group: draborngo-panel-release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dkd_panel_build_release_apk:
    name: DraBornGo Panel v0.0.2 code 2 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Dkd checkout
        uses: actions/checkout@v4

      - name: Dkd setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dkd setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dkd install exact dependencies
        run: npm ci

      - name: Dkd verify Panel release identity
        shell: bash
        run: |
          node <<'DKD_NODE'
          const app=require('./app.json').expo;
          const pkg=require('./package.json');
          if(app.version!=='0.0.2'||pkg.version!=='0.0.2') throw new Error('DKD ERROR: Panel version must be 0.0.2');
          if(Number(app.android.versionCode)!==2) throw new Error('DKD ERROR: Panel versionCode must be 2');
          if(app.android.package!=='com.draborneagle.draborngopanel') throw new Error('DKD ERROR: Panel Android package mismatch');
          console.log('DKD identity OK: DraBornGo Panel v0.0.2 / code 2');
          DKD_NODE
          npx expo config --json > dkd_panel_expo_config.json
          node <<'DKD_NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('dkd_panel_expo_config.json','utf8'));
          if(cfg.version!=='0.0.2'||Number(cfg.android.versionCode)!==2) throw new Error('DKD ERROR: resolved Expo identity mismatch');
          if(cfg.android.package!=='com.draborneagle.draborngopanel') throw new Error('DKD ERROR: resolved package mismatch');
          console.log('DKD resolved Expo identity OK.');
          DKD_NODE

      - name: Dkd prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Dkd generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Dkd tune Gradle release memory
        shell: bash
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\norg.gradle.parallel=false\n' >> android/gradle.properties

      - name: Dkd prepare release signing
        id: signing
        shell: bash
        run: |
          mkdir -p android/app/dkd_secure
          dkd_store_file="android/app/dkd_secure/dkd_panel_release_keystore.jks"
          if [ -n "${DKD_ANDROID_KEYSTORE_BASE64}" ] && [ -n "${DKD_ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${DKD_ANDROID_KEY_ALIAS}" ] && [ -n "${DKD_ANDROID_KEY_PASSWORD}" ]; then
            printf '%s' "${DKD_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${dkd_store_file}"
            test -s "${dkd_store_file}"
            keytool -list -keystore "${dkd_store_file}" -storepass "${DKD_ANDROID_KEYSTORE_PASSWORD}" -alias "${DKD_ANDROID_KEY_ALIAS}" >/dev/null
            echo 'dkd_signing_mode=repository-key' >> "$GITHUB_OUTPUT"
          else
            export DKD_ANDROID_KEYSTORE_PASSWORD='DkdPanelTest2026!'
            export DKD_ANDROID_KEY_PASSWORD='DkdPanelTest2026!'
            export DKD_ANDROID_KEY_ALIAS='dkdPanelRelease'
            keytool -genkeypair -v \
              -keystore "${dkd_store_file}" \
              -storepass "${DKD_ANDROID_KEYSTORE_PASSWORD}" \
              -keypass "${DKD_ANDROID_KEY_PASSWORD}" \
              -alias "${DKD_ANDROID_KEY_ALIAS}" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname 'CN=DraBornGo Panel Test, OU=DrabornEagle, O=DrabornEagle, L=Ankara, C=TR' >/dev/null 2>&1
            echo "DKD_ANDROID_KEYSTORE_PASSWORD=${DKD_ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "DKD_ANDROID_KEY_PASSWORD=${DKD_ANDROID_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "DKD_ANDROID_KEY_ALIAS=${DKD_ANDROID_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo 'dkd_signing_mode=ephemeral-test-key' >> "$GITHUB_OUTPUT"
          fi
          echo "DKD_PANEL_KEYSTORE_FILE=${dkd_store_file}" >> "$GITHUB_ENV"

      - name: Dkd inject release signing config
        shell: bash
        run: |
          cat > android/app/dkd_panel_release_signing.gradle <<'DKD_GRADLE'
          android {
              signingConfigs {
                  dkdPanelRelease {
                      storeFile file('dkd_secure/dkd_panel_release_keystore.jks')
                      storePassword System.getenv('DKD_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('DKD_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('DKD_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.dkdPanelRelease
                  }
              }
          }
          DKD_GRADLE
          printf '\napply from: "dkd_panel_release_signing.gradle"\n' >> android/app/build.gradle

      - name: Dkd build Panel release APK
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Dkd collect and verify APK
        shell: bash
        run: |
          mkdir -p dkd_panel_release_apk_output
          dkd_apk_path="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "${dkd_apk_path}"
          cp "${dkd_apk_path}" dkd_panel_release_apk_output/DraBornGo-Panel-v0.0.2-code2-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose dkd_panel_release_apk_output/DraBornGo-Panel-v0.0.2-code2-release.apk
          sha256sum dkd_panel_release_apk_output/DraBornGo-Panel-v0.0.2-code2-release.apk | tee dkd_panel_release_apk_output/DraBornGo-Panel-v0.0.2-code2-release.sha256.txt
          printf 'signing_mode=%s\n' '${{ steps.signing.outputs.dkd_signing_mode }}' > dkd_panel_release_apk_output/DraBornGo-Panel-v0.0.2-build-info.txt
          ls -lh dkd_panel_release_apk_output

      - name: Dkd upload Panel Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGo_Panel_Release_APK_v0_0_2_code2
          path: dkd_panel_release_apk_output/
          retention-days: 14
