name: Sync shared courier alert Edge source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_sync_shared_edge_source.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync exact source from DraBornGo main
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/DrabornEagle/DraBornGo/main/supabase/functions/send-courier-order-alert/index.ts' -o supabase/functions/send-courier-order-alert/index.ts
          grep -q "dkd_derived_event_value==='picked_up'" supabase/functions/send-courier-order-alert/index.ts
          grep -q "dkd_native_push_tokens" supabase/functions/send-courier-order-alert/index.ts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/send-courier-order-alert/index.ts
          git diff --cached --quiet || (git commit -m 'fix: sync courier alert Edge Function v120 source' && git push origin HEAD:main)
